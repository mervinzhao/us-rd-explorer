<style>

// ---------- generic stacked chart ----------

// ---------- application tab ----------
const A = { years: DATA.years, defl: DATA.deflator, cube: DATA.cube, groups: DATA.domains };

const A_KEYS = A.groups.map((d) => d.key);
function aLayers(by, funders, doms) {
  if (by === "domain") return A.groups.filter((d) => doms.has(d.key));

}

  for (let i = 0; i < N; i++) for (const f of funders) for (const d of doms) {

}

const GCOL = { sw: "var(--d3)", ict: "var(--d7)", bio: "var(--d1)", phys: "var(--d2)", def: "var(--d5)", oth: "var(--d8)", rest: "var(--grid)" };

  const b = DATA.busdev, max = Math.max(...b.items.map((x) => x.value));

    h("h2", null, "Inside business development, ", b.year),
    h("p", null, h("b", null, "Figure 4. "), `Business performed $${b.total.toFixed(0)}B of development in ${b.year} (nominal), mostly product engineering. Software and internet companies account for $${sum("sw").toFixed(0)}B and electronics hardware for $${sum("ict").toFixed(0)}B, against $${sum("bio").toFixed(0)}B in pharma, biotech and medical devices. Each company is filed under its main line of R&D, so its whole program lands in one industry.`),

// ---------- discipline tab ----------

  { key: "bits", label: "Bits", color: "var(--d3)", members: ["computing", "math"] },
  { key: "people", label: "People", color: "var(--d4)", members: ["social"] },
  { key: "other", label: "Other fields", color: "var(--d8)", members: ["other"] },

}
function Growth({ grouping, funders }) {
  const [chMode, setChMode] = useState("both");
